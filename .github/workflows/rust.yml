name: Rust checks

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc
      - name: Win32 layered-window smoke test
        shell: pwsh
        run: >-
          .\target\x86_64-pc-windows-msvc\release\overlay-smoke.exe
          .\target\x86_64-pc-windows-msvc\release\system-monitor-windows.exe
