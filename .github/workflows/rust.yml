name: Rust checks

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Format source (implementation checkpoint)
        run: cargo fmt --all
      - name: Retain formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-rust-source
          path: crates/**/*.rs
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc
      - name: Assemble Rust-only portable directory
        run: cargo run -p system-monitor-core --bin package_port -- target/x86_64-pc-windows-msvc/release/system-monitor-windows.exe rust-port-package
      - name: Upload Rust-only package
        uses: actions/upload-artifact@v4
        with:
          name: kil0bit-system-monitor-rust-port
          path: rust-port-package
      - name: Win32 layered-window smoke test
        shell: pwsh
        run: >-
          .\target\x86_64-pc-windows-msvc\release\overlay-smoke.exe
          .\target\x86_64-pc-windows-msvc\release\system-monitor-windows.exe
